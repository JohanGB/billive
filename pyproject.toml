[project]
name = "factura-viva"
version = "0.2.0"
description = "Facturas electrónicas DIAN + extractos bancarios: gasto real, deducción del 1 % en renta y alertas de precios, con cada cifra rastreable"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "pdfplumber>=0.11"]

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "reportlab"]

[project.scripts]
factura-viva = "factura_viva.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
