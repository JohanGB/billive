# Reglas tributarias como datos versionados. Estado: "verificado" = contrastado con el
# texto oficial en la fecha indicada; "por_verificar" = fuente secundaria o memoria.
# Esto no es asesoría tributaria: confirme siempre con la norma y con la DIAN.
uvt:
  - anio: 2025
    valor: 49799
    fuente: "Resolución DIAN 000193 de 2024"
    estado: por_verificar
  - anio: 2026
    valor: 52374
    fuente: "Resolución DIAN 000238 del 15 de diciembre de 2025, art. 1 (Diario Oficial 53.338 del 17-dic-2025)"
    url: "https://gestornormativo.creg.gov.co/gestor/entorno/docs/resolucion_dian_0238_2025.htm"
    cita_textual: "Fijar en cincuenta y dos mil trescientos setenta y cuatro pesos ($52.374)"
    consultado: 2026-11-11
    estado: verificado

deduccion_factura_electronica:
  - desde: 2023-01-01
    porcentaje: 0.01
    tope_uvt: 240
    # Base del 1 %: el Estatuto dice "valor de las adquisiciones". Mientras no se verifique si
    # incluye impuestos, se calcula sobre el valor antes de impuestos (lo más conservador) y se
    # muestra también el cálculo sobre el total.
    base: valor_sin_impuestos
    fuente: "Estatuto Tributario, art. 336, numeral 5 (adicionado por la Ley 2277 de 2022, art. 7); reglamentado por el Decreto 2231 de 2023"
    url_oficial: "http://www.secretariasenado.gov.co/senado/basedoc/estatuto_tributario_pr014.html"
    estado: por_verificar
    condiciones:
      - id: no_usada_en_otro_beneficio
        texto: "La compra no se solicitó como costo, deducción, impuesto descontable ni otro beneficio"
        comprobable: false      # solo el contribuyente lo sabe
      - id: factura_validada_con_adquiriente
        texto: "Factura electrónica con validación previa, que identifica al comprador con nombre y documento"
        comprobable: true
      - id: pago_electronico
        texto: "Pagada con tarjeta débito, crédito o medio electrónico de una entidad vigilada, en el mismo año"
        comprobable: true
      - id: emisor_obligado
        texto: "Expedida por un obligado a facturar"
        comprobable: false

prueba_de_pago:
  fuente: "DIAN, Concepto 738 [006258] de 2024: si la factura registra un medio de pago distinto, el contribuyente puede probar el pago electrónico con extractos bancarios o comprobantes (libertad probatoria)"
  url: "https://incp.org.co/?p=119565"
  consultado: 2026-11-11
  estado: por_verificar     # leído en reseña del INCP, no en el texto del concepto

# Códigos de medio de pago del XML (tabla 13.3.4.2 del anexo técnico de factura electrónica).
medios_pago:
  estado: por_verificar
  fuente: "DIAN, Anexo técnico de factura electrónica de venta, tabla de medios de pago"
  codigos:
    "1":   {nombre: "Instrumento no definido", electronico: desconocido}
    "10":  {nombre: "Efectivo", electronico: false}
    "20":  {nombre: "Cheque", electronico: false}
    "42":  {nombre: "Consignación bancaria", electronico: true}
    "45":  {nombre: "Transferencia crédito bancario", electronico: true}
    "47":  {nombre: "Transferencia débito bancaria", electronico: true}
    "48":  {nombre: "Tarjeta crédito", electronico: true}
    "49":  {nombre: "Tarjeta débito", electronico: true}
    "71":  {nombre: "Bonos", electronico: false}
    "72":  {nombre: "Vales", electronico: false}
    "ZZZ": {nombre: "Otro", electronico: desconocido}

# Documentos que identifican a un "consumidor final" genérico (no sirven para la deducción).
adquirientes_genericos: ["222222222222", "2222222222"]
